name: Sync material assets

on:
  push:
    branches:
      - dev
    paths:
      - 'common/materials/**'

permissions:
  contents: write

jobs:
  sync-material-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static material package
        run: |
          rm -rf static/materials
          mkdir -p static/materials
          cp common/materials/index.json static/materials/index.json
          cp -R common/materials/parts static/materials/parts

      - name: Commit synced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/materials
          if git diff --cached --quiet; then
            echo "No material asset changes."
            exit 0
          fi
          git commit -m "chore: rebuild chapter-split material assets"
          git push
