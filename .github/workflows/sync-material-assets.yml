name: Sync material assets

on:
  push:
    branches:
      - dev
    paths:
      - 'common/materials/**'
      - 'doc/MarkdownFiles/**'
      - 'scripts/prepare_materials.py'

permissions:
  contents: write

jobs:
  sync-material-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild clean structured materials from Markdown
        run: |
          python3 scripts/prepare_materials.py

      - name: Build static chapter-split package
        run: |
          rm -rf static/materials
          mkdir -p static/materials
          cp common/materials/index.json static/materials/index.json
          cp -R common/materials/parts static/materials/parts

      - name: Commit generated materials and synced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/materials static/materials
          if git diff --cached --quiet; then
            echo "No material changes."
            exit 0
          fi
          git commit -m "build: regenerate clean chapter-split study materials"
          git push
