name: rebuild-materials
on:
  # Material generation and static sync are handled by sync-material-assets.yml.
  # Keep manual dispatch for maintainers who want to rebuild the JSON bundle only.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild structured materials
        run: python scripts/prepare_materials.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/materials/*.json
          if git diff --cached --quiet; then
            echo 'No generated-data changes.'
          else
            git commit -m 'build: regenerate structured study materials'
            git push origin HEAD:dev
          fi
